name: Build LiteList Win10

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-win10:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK (for building net48)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore and Build net48 x64
        run: |
          dotnet restore LiteList.csproj
          dotnet build LiteList.csproj -c Release --no-restore -o publish-out

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Remove-Item "publish-out/*.pdb" -ErrorAction SilentlyContinue
          Remove-Item "publish-out/*.xml" -ErrorAction SilentlyContinue
          Compress-Archive -Path "publish-out/*" -DestinationPath "dist/LiteList-win10-x64.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteList-win10-x64
          path: dist/LiteList-win10-x64.zip

  release:
    needs: build-win10
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: LiteList-win10-x64
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
